<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pixel Squadron</title>
<meta name="description" content="A tiny top-down twin-stick arena shooter, built with raylib and compiled to WebAssembly.">
<meta property="og:title" content="Pixel Squadron">
<meta property="og:description" content="A tiny top-down twin-stick arena shooter - playable in the browser.">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a1016; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         color: #cfe9f2; }

  /* The canvas always fills the viewport. The game sizes its own virtual
     screen (and thus its zoom) from whatever shape it is handed, so a canvas
     that is not 16:9 simply reveals more of the world - whereas a canvas kept
     at raylib's requested aspect ratio gets letterboxed inside the page, which
     is exactly the black-bar problem. raylib keeps the backing store in step
     with this box (the web build leaves FLAG_WINDOW_RESIZABLE on for that), so
     nothing is ever CSS-scaled on top of the game's own scaling. */
  canvas.emscripten {
    display: block; outline: none; cursor: none;
    background: #0a1016;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 100vw !important;
    height: 100vh !important;
  }

  /* Only ever seen while the wasm is downloading - it fades out on its own.
     Same night-navy the game clears to, same steel panel hairlines, and the
     actual ships.png sprites waiting in formation. */
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #0a1016; transition: opacity .35s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #title {
    font-size: 30px; letter-spacing: 9px; color: #cfe9f5;
    text-shadow: 3px 3px 0 #14252f;
  }
  #subtitle { font-size: 11px; letter-spacing: 3px; color: #6d93a8; }

  /* the ships straight out of sprites/ships.png, crisp and bobbing */
  #squad { display: flex; align-items: flex-end; gap: 40px; margin: 4px 0 2px; }
  .spr { position: relative; image-rendering: pixelated; animation: bob 1.4s steps(4, end) infinite; }
  .spr.wing { width: 84px;  height: 84px;  margin-bottom: 6px; }
  .spr.lead { width: 102px; height: 102px; }
  .spr:nth-child(1) { animation-delay: 0s;   }
  .spr:nth-child(2) { animation-delay: .45s; }
  .spr:nth-child(3) { animation-delay: .9s;  }
  @keyframes bob {
    0%   { transform: translateY(0);    }
    50%  { transform: translateY(-6px); }
    100% { transform: translateY(0);    }
  }

  #bar {
    width: 268px; height: 14px; background: #0c141c;
    border: 3px solid #2a4457;
    box-shadow: 0 4px 0 #060b10;
    padding: 2px;
  }
  #bar > i {
    display: block; height: 100%; width: 0%;
    background: repeating-linear-gradient(90deg,
      #7ee2fa 0 7px, #58b8d8 7px 14px);
    transition: width .2s steps(5, end);
  }
  #msg { font-size: 12px; color: #7f9db4; }

  /* the ships straight out of sprites/ships.png, crisp and bobbing */

  .spr { position: relative; image-rendering: pixelated; animation: bob 1.4s steps(4, end) infinite; }

  .spr:nth-child(2) { animation-delay: .45s; }
  .spr:nth-child(3) { animation-delay: .9s;  }
  @keyframes bob {
    0%   { transform: translateY(0);    }
    50%  { transform: translateY(-6px); }
    100% { transform: translateY(0);    }
  }

    width: 268px; height: 14px; background: #0c141c;
    border: 3px solid #2a4457;
    box-shadow: 0 4px 0 #060b10;
    padding: 2px;
  }
  #bar > i {
    display: block; height: 100%; width: 0%;
    background: repeating-linear-gradient(90deg,
      #7ee2fa 0 7px, #58b8d8 7px 14px);
    transition: width .2s steps(5, end);
  }

</style>

    <div id="msg">fueling up&hellip;</div>

  <script>
    var overlayEl = document.getElementById('overlay');
    var msgEl     = document.getElementById('msg');
    var barEl     = document.getElementById('prog');
    var canvasEl  = document.getElementById('canvas');
  window.__mx = 240; window.__my = 135; window.__moved = 0;
  var __mx = 240, __my = 135;

  function trackMouse(e) {
    var r = canvasEl.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      __mx = (e.clientX - r.left) * (480.0 / r.width);
      __my = (e.clientY - r.top)  * (270.0 / r.height);
    }
    window.__mx = __mx; window.__my = __my; window.__moved++;
  }

  window.addEventListener('mousemove', trackMouse, true);
  canvasEl.addEventListener('mousemove', trackMouse, true);

    var Module = {
      preRun: [],
      postRun: [function () { readyToPlay(); }],
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); },
      canvas: canvasEl,
      setStatus: function (text) {
        if (!text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) {
          msgEl.textContent = m[1];
          barEl.style.width = (parseInt(m[2], 10) / parseInt(m[4], 10) * 100) + '%';
        } else {
          msgEl.textContent = text;
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {},
      requestFullscreen: function () {}   /* the F11 handler below does this properly */
    };

    window.onerror = function () {
      msgEl.textContent = 'Something went wrong &mdash; see the browser console.';
    };
  </script>

  <script>
    /* Browsers only start audio after a user gesture, so wrap AudioContext and
       keep every instance in one place; the first key press or click anywhere
       resumes them. */
    var audioCtxs = [];
    (function () {
      if (!window.AudioContext) return;
      var AC = window.AudioContext;
      window.AudioContext = new Proxy(AC, {
        construct: function (target, args) {
          var ctx = new target(...args);
          audioCtxs.push(ctx);
          return ctx;
        }
      });
    })();

    function resumeAudio() {
      for (var i = 0; i < audioCtxs.length; i++) {
        if (audioCtxs[i].state === 'suspended') audioCtxs[i].resume();
      }
    }

    /* Go straight into the game. The card above only exists to cover the
       download, so it fades away by itself as soon as the wasm is running -
       there is nothing to click. */
    function readyToPlay() {
      msgEl.textContent = 'ready';
      barEl.style.width = '100%';
      overlayEl.classList.add('hidden');
      canvasEl.focus();
      resumeAudio();
    }

    window.addEventListener('keydown', resumeAudio, true);
    window.addEventListener('pointerdown', resumeAudio, true);

    /* F11 asks the *browser* for fullscreen. raylib's own fullscreen handling
       only letterboxes on the web, so the key is intercepted here before it
       ever reaches the game. */
    window.addEventListener('keydown', function (e) {
      if (e.key !== 'F11' && e.code !== 'F11') return;

      e.preventDefault();
      e.stopPropagation();

      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        var el = canvasEl;
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
    }, true);
  </script>
