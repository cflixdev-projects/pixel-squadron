<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pixel Squadron</title>
<meta name="description" content="A tiny top-down twin-stick arena shooter, built with raylib and compiled to WebAssembly.">
<meta property="og:title" content="Pixel Squadron">
<meta property="og:description" content="A tiny top-down twin-stick arena shooter - playable in the browser.">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a1016; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         color: #cfe9f2; }

  /* The canvas always fills the viewport. The game sizes its own virtual
     screen (and thus its zoom) from whatever shape it is handed, so a canvas
     that is not 16:9 simply reveals more of the world - whereas a canvas kept
     at raylib's requested aspect ratio gets letterboxed inside the page, which
     is exactly the black-bar problem. raylib keeps the backing store in step
     with this box (the web build leaves FLAG_WINDOW_RESIZABLE on for that), so
     nothing is ever CSS-scaled on top of the game's own scaling. */
  canvas.emscripten {
    display: block; outline: none; cursor: none;
    background: #0a1016;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    width: 100vw !important;
    height: 100vh !important;
  }

  /* Only ever seen while the wasm is downloading - it fades out on its own.
     Everything is drawn the way the game draws: warm hangar palette, pixels
     that stay square, and three box-shadow "sprites" waiting in formation. */
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; background: #140d09; transition: opacity .35s ease;
    background-image:
      linear-gradient(0deg, #241610 0%, #1a1009 55%, #140d09 100%);
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #title {
    font-size: 30px; letter-spacing: 9px; color: #ffba5c;
    text-shadow: 3px 3px 0 #40200f;
  }
  #subtitle { font-size: 11px; letter-spacing: 3px; color: #a87e5c; }

  /* one 1px div extruded by box-shadow pixels, hourglass bobbing shipped in */
  #squad { display: flex; gap: 46px; margin: 4px 0 2px; }
  .ship {
    width: 1px; height: 1px; position: relative;
    animation: bob 1.4s steps(4, end) infinite;
  }
  .ship::before {
    content: ""; position: absolute; top: 0; left: 0;
    width: 1px; height: 1px;
    box-shadow: 6px 0px 0 #e8eef7, 6px 1px 0 #e8eef7, 5px 2px 0 #e8eef7, 6px 2px 0 #e8eef7, 7px 2px 0 #e8eef7, 4px 3px 0 #e8eef7, 5px 3px 0 #e8eef7, 6px 3px 0 #e8eef7, 7px 3px 0 #e8eef7, 8px 3px 0 #e8eef7, 2px 4px 0 #e8eef7, 4px 4px 0 #e8eef7, 5px 4px 0 #e8eef7, 6px 4px 0 #e8eef7, 7px 4px 0 #e8eef7, 8px 4px 0 #e8eef7, 10px 4px 0 #e8eef7, 1px 5px 0 #8bbdf0, 2px 5px 0 #8bbdf0, 3px 5px 0 #8bbdf0, 4px 5px 0 #e8eef7, 5px 5px 0 #e8eef7, 6px 5px 0 #e8eef7, 7px 5px 0 #e8eef7, 8px 5px 0 #e8eef7, 9px 5px 0 #8bbdf0, 10px 5px 0 #8bbdf0, 11px 5px 0 #8bbdf0, 1px 6px 0 #8bbdf0, 2px 6px 0 #8bbdf0, 4px 6px 0 #5b8ac2, 5px 6px 0 #e8eef7, 6px 6px 0 #e8eef7, 7px 6px 0 #e8eef7, 8px 6px 0 #5b8ac2, 10px 6px 0 #8bbdf0, 11px 6px 0 #8bbdf0, 2px 7px 0 #8bbdf0, 3px 7px 0 #ffba5c, 4px 7px 0 #ffba5c, 5px 7px 0 #ffba5c, 6px 7px 0 #ffba5c, 7px 7px 0 #ffba5c, 8px 7px 0 #ffba5c, 9px 7px 0 #ffba5c, 10px 7px 0 #8bbdf0, 3px 8px 0 #ffba5c, 8px 8px 0 #ffba5c;
    transform: scale(8);
    transform-origin: top left;
  }
  .ship:nth-child(1) { animation-delay: 0s;   }
  .ship:nth-child(2) { animation-delay: .45s; }
  .ship:nth-child(3) { animation-delay: .9s;  }
  @keyframes bob {
    0%   { transform: translateY(0);    }
    50%  { transform: translateY(-6px); }
    100% { transform: translateY(0);    }
  }

  #bar {
    width: 268px; height: 14px; background: #22150e;
    border: 3px solid #8a6440;
    box-shadow: 0 4px 0 #100904;
    padding: 2px;
  }
  #bar > i {
    display: block; height: 100%; width: 0%;
    background: repeating-linear-gradient(90deg,
      #ffba5c 0 7px, #f49a3c 7px 14px);
    transition: width .2s steps(5, end);
  }
  #msg { font-size: 12px; color: #b08a68; }
</style>
</head>
<body>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <div id="overlay">
    <div id="title">PIXEL SQUADRON</div>
    <div id="subtitle">HANGAR 7 &mdash; SQUADRON ASSEMBLING</div>
    <div id="squad"><div class="ship"></div><div class="ship"></div><div class="ship"></div></div>
    <div id="bar"><i id="prog"></i></div>
    <div id="msg">fueling up&hellip;</div>
  </div>

  <script>
    var overlayEl = document.getElementById('overlay');
    var msgEl     = document.getElementById('msg');
    var barEl     = document.getElementById('prog');
    var canvasEl  = document.getElementById('canvas');
  window.__mx = 240; window.__my = 135; window.__moved = 0;
  var __mx = 240, __my = 135;

  function trackMouse(e) {
    var r = canvasEl.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      __mx = (e.clientX - r.left) * (480.0 / r.width);
      __my = (e.clientY - r.top)  * (270.0 / r.height);
    }
    window.__mx = __mx; window.__my = __my; window.__moved++;
  }

  window.addEventListener('mousemove', trackMouse, true);
  canvasEl.addEventListener('mousemove', trackMouse, true);

    var Module = {
      preRun: [],
      postRun: [function () { readyToPlay(); }],
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); },
      canvas: canvasEl,
      setStatus: function (text) {
        if (!text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) {
          msgEl.textContent = m[1];
          barEl.style.width = (parseInt(m[2], 10) / parseInt(m[4], 10) * 100) + '%';
        } else {
          msgEl.textContent = text;
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {},
      requestFullscreen: function () {}   /* the F11 handler below does this properly */
    };

    window.onerror = function () {
      msgEl.textContent = 'Something went wrong &mdash; see the browser console.';
    };
  </script>

  <script>
    /* Browsers only start audio after a user gesture, so wrap AudioContext and
       keep every instance in one place; the first key press or click anywhere
       resumes them. */
    var audioCtxs = [];
    (function () {
      if (!window.AudioContext) return;
      var AC = window.AudioContext;
      window.AudioContext = new Proxy(AC, {
        construct: function (target, args) {
          var ctx = new target(...args);
          audioCtxs.push(ctx);
          return ctx;
        }
      });
    })();

    function resumeAudio() {
      for (var i = 0; i < audioCtxs.length; i++) {
        if (audioCtxs[i].state === 'suspended') audioCtxs[i].resume();
      }
    }

    /* Go straight into the game. The card above only exists to cover the
       download, so it fades away by itself as soon as the wasm is running -
       there is nothing to click. */
    function readyToPlay() {
      msgEl.textContent = 'ready';
      barEl.style.width = '100%';
      overlayEl.classList.add('hidden');
      canvasEl.focus();
      resumeAudio();
    }

    window.addEventListener('keydown', resumeAudio, true);
    window.addEventListener('pointerdown', resumeAudio, true);

    /* F11 asks the *browser* for fullscreen. raylib's own fullscreen handling
       only letterboxes on the web, so the key is intercepted here before it
       ever reaches the game. */
    window.addEventListener('keydown', function (e) {
      if (e.key !== 'F11' && e.code !== 'F11') return;

      e.preventDefault();
      e.stopPropagation();

      if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        var el = canvasEl;
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
    }, true);
  </script>

  {{{ SCRIPT }}}
</body>
</html>
