<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pixel Squadron</title>
<meta name="description" content="A tiny top-down twin-stick arena shooter, built with raylib and compiled to WebAssembly.">
<meta property="og:title" content="Pixel Squadron">
<meta property="og:description" content="A tiny top-down twin-stick arena shooter - playable in the browser.">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a1016; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         color: #cfe9f2; }

  /* No border/padding on the canvas: raylib converts mouse coords from the
     canvas box, and any inset would offset them. */
  canvas.emscripten {
    display: block; outline: none; cursor: crosshair;
    background: #0a1016;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    max-width: 100vw; max-height: 100vh;
  }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #0a1016; transition: opacity .35s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #title { font-size: 26px; letter-spacing: 8px; color: #7ee2fa; }
  #bar { width: 260px; height: 8px; border: 1px solid #29506a; background: #101c26; }
  #bar > i { display: block; height: 100%; width: 0%; background: #7ee2fa; transition: width .2s ease; }
  #msg { font-size: 13px; color: #7d9db0; }

  #play {
    display: none; padding: 12px 28px; border: 1px solid #7ee2fa; border-radius: 2px;
    background: #0e2a38; color: #d8f6ff; font: inherit; letter-spacing: 2px; cursor: pointer;
  }
  #play:hover { background: #14415a; }
</style>
</head>
<body>
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <div id="overlay">
    <div id="title">PIXEL SQUADRON</div>
    <div id="bar"><i id="prog"></i></div>
    <div id="msg">loading&hellip;</div>
    <button id="play">&#9654; CLICK TO PLAY</button>
  </div>

  <script>
    var overlayEl = document.getElementById('overlay');
    var msgEl     = document.getElementById('msg');
    var barEl     = document.getElementById('prog');
    var playEl    = document.getElementById('play');
    var canvasEl  = document.getElementById('canvas');

    var Module = {
      preRun: [],
      postRun: [function () { readyToPlay(); }],
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); },
      canvas: canvasEl,
      setStatus: function (text) {
        if (!text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) {
          msgEl.textContent = m[1];
          barEl.style.width = (parseInt(m[2], 10) / parseInt(m[4], 10) * 100) + '%';
        } else {
          msgEl.textContent = text;
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {},
      requestFullscreen: function () {}   /* overridden below once the game is up */
    };

    window.onerror = function () {
      msgEl.textContent = 'Something went wrong &mdash; see the browser console.';
    };
  </script>

  <script>
    /* Browsers only start audio after a user gesture, so wrap AudioContext and
       hand every instance to a single "resume" call triggered by the button. */
    var audioCtxs = [];
    (function () {
      if (!window.AudioContext) return;
      var AC = window.AudioContext;
      window.AudioContext = new Proxy(AC, {
        construct: function (target, args) {
          var ctx = new target(...args);
          audioCtxs.push(ctx);
          return ctx;
        }
      });
    })();

    function resumeAudio() {
      for (var i = 0; i < audioCtxs.length; i++) {
        if (audioCtxs[i].state === 'suspended') audioCtxs[i].resume();
      }
    }

    function readyToPlay() {
      msgEl.textContent = 'ready';
      barEl.style.width = '100%';
      playEl.style.display = 'inline-block';
      playEl.focus();
    }

    playEl.addEventListener('click', function () {
      resumeAudio();
      overlayEl.classList.add('hidden');
      canvasEl.focus();
      playEl.blur();
    });

    /* Belt and braces: resume audio on the first key press too. */
    document.addEventListener('keydown', resumeAudio);
  </script>

  {{{ SCRIPT }}}
</body>
</html>
